<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">InterviaIQ competency report preview</title>
  <desc id="desc">A simplified product preview based on the ACA report interface, with an illustrative score of 78 and three competency bars.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dy="12" stdDeviation="14" flood-color="#263a6b" flood-opacity=".10"/></filter>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="26" y="27" width="588" height="382" rx="22" fill="#fff" stroke="#d7e0ee" filter="url(#shadow)"/>
    <path d="M26 96H614" stroke="#e8ecf3"/>
    <rect x="49" y="49" width="30" height="30" rx="9" fill="#4265df"/>
    <circle cx="64" cy="64" r="8" stroke="#fff" stroke-width="1.3"/>
    <ellipse cx="64" cy="64" rx="3.6" ry="8" stroke="#fff" stroke-width="1.1"/>
    <path d="M56 64H72" stroke="#fff" stroke-width="1.1"/>
    <text x="90" y="70" fill="#151d30" font-size="21" font-weight="700" letter-spacing="-.7">InterviaIQ</text>
    <rect x="478" y="52" width="111" height="25" rx="12.5" fill="#f3f5fa"/>
    <text x="533.5" y="68.5" text-anchor="middle" fill="#788396" font-size="10" letter-spacing="1.1">SAMPLE REPORT</text>

    <text x="49" y="134" fill="#25324a" font-size="21" font-weight="700" letter-spacing="-.55">AI Competency Report</text>
    <text x="49" y="157" fill="#8490a4" font-size="12">Your strengths. Your next steps.</text>

    <rect x="49" y="183" width="190" height="164" rx="16" fill="#f4f6fd"/>
    <text x="68" y="209" fill="#7b89a5" font-size="10" font-weight="600" letter-spacing="1.4">OVERALL SCORE</text>
    <text x="67" y="287" fill="#233a78" font-size="76" font-weight="700" letter-spacing="-5">78</text>
    <text x="164" y="282" fill="#9ca8c0" font-size="20">/100</text>
    <rect x="68" y="309" width="92" height="23" rx="11.5" fill="#e5ebfc"/>
    <circle cx="81" cy="320.5" r="3" fill="#4265df"/>
    <text x="91" y="324.5" fill="#4362b9" font-size="11" font-weight="600">Proficient</text>

    <text x="266" y="199" fill="#8994a7" font-size="10" font-weight="600" letter-spacing="1.4">COMPETENCY SPECTRUM</text>
    <text x="266" y="232" fill="#334159" font-size="14" font-weight="600">AI Fluency</text>
    <text x="589" y="232" text-anchor="end" fill="#4265df" font-size="14" font-weight="700">84</text>
    <rect x="266" y="244" width="323" height="8" rx="4" fill="#edf0f7"/>
    <rect x="266" y="244" width="271" height="8" rx="4" fill="#5c7be9"/>
    <text x="266" y="277" fill="#334159" font-size="14" font-weight="600">Workflow Integration</text>
    <text x="589" y="277" text-anchor="end" fill="#4265df" font-size="14" font-weight="700">82</text>
    <rect x="266" y="289" width="323" height="8" rx="4" fill="#edf0f7"/>
    <rect x="266" y="289" width="265" height="8" rx="4" fill="#5c7be9"/>
    <text x="266" y="322" fill="#334159" font-size="14" font-weight="600">Critical Evaluation</text>
    <text x="589" y="322" text-anchor="end" fill="#4265df" font-size="14" font-weight="700">68</text>
    <rect x="266" y="334" width="323" height="8" rx="4" fill="#edf0f7"/>
    <rect x="266" y="334" width="220" height="8" rx="4" fill="#5c7be9"/>

    <path d="M49 366H589" stroke="#e8ecf3"/>
    <circle cx="56" cy="387" r="5" fill="#8c9bb8"/>
    <text x="70" y="391" fill="#6d7b94" font-size="11">Assessment complete</text>
    <text x="589" y="391" fill="#4265df" font-size="12" font-weight="600" text-anchor="end">View report ↗</text>
  </g>
</svg>
